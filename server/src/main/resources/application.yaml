spring:
  application:
    name: feastflow
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

token:
  cleanup:
    interval-ms: 60000

bucket4j:
  enabled: true
  filters:
    - filter-name: authRateLimitFilter
      url: /auth/*
      rate-limits:
        - bandwidths:
            - capacity: 8
              refill: greedy
              refill-tokens: 8
              refill-period: 5m
    - filter-name: registerRateLimitFilter
      url: /auth/register
      rate-limits:
        - bandwidths:
            - capacity: 5
              refill: greedy
              refill-tokens: 5
              refill-period: 5m